<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<!-- Lets "Add to Home Screen" run full-screen like an app on iPad -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Farsi Friends" />
<title>Farsi Friends</title>
<style>
  :root {
    --sky: #8ed6ff;
    --grass: #ffd36e;
    --pink: #ff7eb6;
    --purple: #9b6dff;
    --green: #4cd964;
    --card: #fffbe8;
    --ink: #3a2a55;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  body {
    background: linear-gradient(180deg, var(--sky) 0%, #bdeaff 55%, var(--grass) 55%, #ffe39a 100%);
    touch-action: manipulation;
  }
  button {
    font-family: inherit; font-weight: 800; color: var(--ink);
    border: none; border-radius: 28px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18); transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }

  .screen { position: absolute; inset: 0; display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px;
            overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen.active { display: flex; }
  /* Learn can hold many cards — let it grow & scroll from the top */
  #learn { justify-content: flex-start; padding-bottom: 90px;
           padding-top: calc(80px + env(safe-area-inset-top, 0px)); }

  .mascot { width: 180px; height: 180px; transition: transform .25s; }
  .mascot.happy { animation: bounce .5s ease 2; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-26px) scale(1.05)} }

  /* Koochooloo rolls across the screen in her wheel (home) */
  .roll-track { position: relative; width: 100%; max-width: 820px; height: 184px;
    overflow: hidden; cursor: pointer; }
  .roller { position: absolute; top: 14px; left: -170px; width: 160px; height: 160px;
    animation: rollAcross 5.5s linear 2 forwards; }
  /* after rolling across twice she parks in the middle and runs in place */
  .roller.parked { left: 50%; transform: translateX(-50%); animation: none; }
  .wheel { position: absolute; inset: 0; width: 160px; height: 160px;
    animation: spin 1.4s linear infinite; }
  #mascot-home { width: 104px; height: 104px; position: absolute; left: 28px; top: 28px;
    z-index: 2; animation: runbob .4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rollAcross { from { left: -170px; } to { left: 100%; } }
  @keyframes runbob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
  #home-en { font-size: 16px; color: #5a4a75; margin: 2px 0 6px; font-weight: 800; }

  .bubble {
    background: #fff; border-radius: 22px; padding: 14px 22px; margin-bottom: 8px;
    font-size: 30px; font-weight: 800; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    max-width: 80vw; text-align: center;
  }
  .bubble:after { content:""; position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
    border:12px solid transparent; border-top-color:#fff; }

  h1 { font-size: 38px; margin: 0 0 6px; text-shadow: 0 3px 0 rgba(255,255,255,.5); }
  h2 { font-size: 30px; margin: 4px 0 14px; }

  .big-btn { font-size: 30px; padding: 22px 40px; margin: 10px; min-width: 240px; }
  .btn-pink   { background: var(--pink);   color:#fff; }
  .btn-green  { background: var(--green);  color:#fff; }
  .btn-purple { background: var(--purple); color:#fff; }

  /* Theme picker tiles on the home screen */
  .themes { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .theme-tile {
    width: 200px; height: 200px; border-radius: 32px; background: var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
  }
  .theme-tile .ico { font-size: 84px; line-height:1; }
  .theme-tile .lbl { font-size: 24px; font-weight: 800; }

  /* Fixed, not absolute: on Learn the screen itself scrolls, and an absolute
     back button scrolled away with the cards. Only the active screen is
     displayed, so its button is the only one on screen. */
  .back {
    position: fixed; font-size: 22px;
    top:  calc(18px + env(safe-area-inset-top, 0px));
    left: calc(18px + env(safe-area-inset-left, 0px));
    padding: 12px 22px; background:#fff; z-index: 5;
  }

  #learn-content { width: 100%; max-width: 820px; }
  .section-head {
    font-size: 24px; font-weight: 800; color: var(--ink);
    background: rgba(255,255,255,.75); border-radius: 18px;
    padding: 8px 18px; margin: 22px 0 12px; box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }
  .section-head:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
          width: 100%; max-width: 820px; }
  @media (max-width: 600px){ .grid { grid-template-columns: repeat(2,1fr);} }
  .card {
    background: var(--card); border-radius: 28px; padding: 18px 10px; text-align:center;
    box-shadow: 0 6px 0 rgba(0,0,0,.12); cursor: pointer; transition: transform .08s;
  }
  .card:active { transform: scale(.95); }
  .card .emoji { font-size: 64px; line-height: 1; }
  .card .fa { font-size: 30px; font-weight: 800; direction: rtl; margin-top: 6px; }
  .card .tr { font-size: 18px; color: var(--purple); font-weight: 800; }
  .card .en { font-size: 15px; color: #8a7aa5; }

  .prompt-btn {
    font-size: 26px; background: var(--purple); color:#fff; padding: 18px 30px; margin: 14px;
  }
  .choices { display:flex; gap: 20px; flex-wrap: wrap; justify-content:center; margin-top: 10px; }
  .choice {
    width: 150px; height: 150px; border-radius: 28px; background: var(--card);
    font-size: 80px; box-shadow: 0 6px 0 rgba(0,0,0,.12);
  }
  .choice.wrong { animation: shake .4s; }
  .choice.right { animation: pop .4s; background: #d6ffd9; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  @keyframes pop { 50%{ transform: scale(1.2);} }

  /* Story / conversation stage */
  /* "Hear the real story" — only shown when the local recording is present */
  .orig-btn { display:none; margin-top:14px; padding:10px 20px; border:0; border-radius:999px;
              background:#6b4ea8; color:#fff; font-size:17px; font-weight:600; cursor:pointer; }
  .orig-btn.on { display:inline-block; }
  #listen-credit { font-size:14px; opacity:.72; margin:2px 0 4px; text-align:center; }
  #listen-scene { width:min(88vw,460px); height:auto; aspect-ratio:5/3; border-radius:16px;
                  box-shadow:0 4px 18px rgba(0,0,0,.16); background:#bfe3f5; }
  /* Fixed height for two lines, so the picture doesn't jump as subtitles change */
  #listen-sub { width:min(88vw,460px); min-height:3.1em; margin:10px 0 2px; padding:0 6px;
                font-size:19px; line-height:1.45; text-align:center; font-weight:600; }
  #listen-sub.sung { font-style:italic; color:#6b4ea8; }

  /* ---- Scene animation. Every piece is an inner <g>, so these transforms
         compose with the placement transform on the parent instead of
         replacing it. Rotations need an origin, hence transform-box. ---- */
  #listen-scene .a-bob    { animation: sc-bob 2.6s ease-in-out infinite; }
  #listen-scene .a-flap   { animation: sc-flap 0.6s ease-in-out infinite;
                            transform-box: fill-box; transform-origin: 90% 60%; }
  #listen-scene .a-swish  { animation: sc-swish 2.2s ease-in-out infinite;
                            transform-box: fill-box; transform-origin: 100% 50%; }
  #listen-scene .a-note   { animation: sc-note 2.4s ease-out infinite; }
  #listen-scene .a-pulse  { animation: sc-pulse 1.6s ease-in-out infinite;
                            transform-box: fill-box; transform-origin: 50% 50%; }
  #listen-scene .a-shake  { animation: sc-shake 0.32s ease-in-out infinite; }
  #listen-scene .a-run    { animation: sc-run 0.42s ease-in-out infinite; }
  #listen-scene .a-rise   { animation: sc-rise 14s ease-out forwards; }
  #listen-scene .a-fall   { animation: sc-fall 5s ease-in-out infinite; }
  #listen-scene .a-wobble { animation: sc-wobble 1.4s ease-in-out infinite;
                            transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sc-bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes sc-flap  { 0%,100% { transform: rotate(0deg); }  50% { transform: rotate(-26deg); } }
  @keyframes sc-swish { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
  @keyframes sc-note  { 0% { transform: translateY(6px); opacity:0; }
                        25% { opacity:.95; } 100% { transform: translateY(-30px); opacity:0; } }
  @keyframes sc-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  @keyframes sc-shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px,1px); }
                        75% { transform: translate(3px,-1px); } }
  @keyframes sc-run   { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-4px,-2px); } }
  @keyframes sc-rise  { 0% { transform: translateY(34px); } 100% { transform: translateY(0); } }
  @keyframes sc-fall  { 0% { transform: translate(0,-4px) rotate(-8deg); opacity:.85; }
                        100% { transform: translate(3px,5px) rotate(10deg); opacity:1; } }
  @keyframes sc-wobble{ 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  /* Each new scene fades up rather than cutting */
  #listen-scene.fade { animation: sc-in .55s ease; }
  @keyframes sc-in { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    #listen-scene * { animation: none !important; }
  }
  #listen-parts { display:flex; gap:10px; margin:6px 0 14px; }
  .part-btn { padding:8px 18px; border:2px solid #6b4ea8; border-radius:999px; background:#fff;
              color:#6b4ea8; font-size:16px; font-weight:600; cursor:pointer; }
  .part-btn.sel { background:#6b4ea8; color:#fff; }
  #listen-bar { width:min(78vw,420px); height:12px; border-radius:999px; background:rgba(0,0,0,.13);
                margin:16px 0 6px; overflow:hidden; cursor:pointer; }
  #listen-fill { height:100%; width:0; border-radius:999px; background:#6b4ea8; transition:width .25s linear; }
  #listen-time { font-size:15px; opacity:.7; font-variant-numeric:tabular-nums; }
  .stage { display:flex; gap:40px; align-items:flex-end; margin:14px 0 18px; }
  .stage.trio { gap:18px; }
  .stage.trio .actor { width:104px; height:104px; }
  .actor { width:130px; height:130px; opacity:.4; transition: opacity .2s, transform .2s; }
  .actor.speaking { opacity:1; transform: scale(1.15); }
  .actor.happy { animation: bounce .5s ease 2; }
  #story-en { font-size:18px; color:#5a4a75; min-height:22px; text-align:center; margin-bottom:4px; }
  #feed-en { font-size:18px; color:#5a4a75; min-height:22px; text-align:center; }
  #feed-meter { position:relative; width:280px; height:32px; background:#fff; border-radius:18px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.15); overflow:hidden; margin:10px 0; }
  #feed-fill { height:100%; width:0%; border-radius:18px; transition: width .45s ease;
    background:linear-gradient(90deg,#7ed957,#ffd23f,#ff9b3f); }
  #feed-meter-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; color:#3a2a55; }
  #feed-hamster-wrap { display:inline-block; }
  #feed-hamster-wrap.chomp { animation: chomp .4s ease; }
  @keyframes chomp { 0%,100%{ transform: translateY(0); } 45%{ transform: translateY(-12px) scaleY(.9); } }
  #feed-hamster { display:block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }  /* springy stretch as she grows */
  .flying-food { position: fixed; z-index: 60; font-size: 64px; line-height: 1;
    margin-left: -35px; margin-top: -35px; pointer-events: none;
    animation: arc .65s ease-in forwards; }
  @keyframes arc {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    50%  { transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .5 - 70px)) scale(.8); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: .15; }
  }
  #story-controls { display:flex; gap:14px; align-items:center; }
  .choice-line { background: var(--card); border-radius:22px; padding:14px 22px; margin:6px;
    min-width:240px; box-shadow:0 5px 0 rgba(0,0,0,.12); text-align:center; }
  .choice-line .cl-fa { font-size:26px; font-weight:800; direction:rtl; }
  .choice-line .cl-en { font-size:15px; color:#8a7aa5; }

  .confetti { position: fixed; top:-40px; font-size: 32px; pointer-events:none; z-index: 50;
              animation: fall 1.6s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  #voice-tip { position:fixed; bottom:0; left:0; right:0; background:#3a2a55; color:#fff;
    font-size:13px; padding:10px 14px; text-align:center; z-index:99; line-height:1.4; display:none; }
  #voice-tip b { margin-left:8px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>

<!-- ================= HOME (pick a theme) ================= -->
<section id="home" class="screen active">
  <div class="bubble" id="home-bubble">سلام!</div>
  <div class="roll-track" id="roll-track" onclick="kooSpeak()">
    <div class="roller" id="roller">
      <svg class="wheel" id="wheel" viewBox="0 0 200 200"></svg>
      <svg class="mascot" id="mascot-home" viewBox="0 0 200 200"></svg>
    </div>
  </div>
  <div id="home-en">Tap Koochooloo as she rolls by!</div>
  <h1>Farsi Friends</h1>
  <div class="themes" id="theme-list"></div>
</section>

<!-- ================= MENU (Learn / Play for a theme) ================= -->
<section id="menu" class="screen">
  <button class="back" onclick="go('home')">⬅︎</button>
  <div class="bubble" id="menu-title" style="font-size:26px">Theme</div>
  <button class="big-btn btn-pink"  onclick="go('learn')">📚 Learn</button>
  <button class="big-btn btn-green" onclick="startPlay()">🎮 Play</button>
</section>

<!-- ================= LEARN ================= -->
<section id="learn" class="screen">
  <button class="back" onclick="go('menu')">⬅︎</button>
  <div class="bubble" id="learn-bubble" style="font-size:24px">Tap a card to hear it!</div>
  <div id="learn-content"></div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="screen">
  <button class="back" onclick="go('menu')">⬅︎</button>
  <svg class="mascot" id="mascot-play" viewBox="0 0 200 200" style="width:130px;height:130px"></svg>
  <button class="prompt-btn" onclick="sayCurrent()">🔊 Say it again</button>
  <div class="choices" id="choices"></div>
</section>

<!-- ================= STORY PICKER ================= -->
<section id="stories" class="screen">
  <button class="back" onclick="go('home')">⬅︎</button>
  <div class="bubble" style="font-size:26px">🎬 Stories</div>
  <div class="themes" id="story-list"></div>
</section>

<!-- ================= STORY (conversation) ================= -->
<section id="story" class="screen">
  <button class="back" onclick="go('stories')">⬅︎</button>
  <div class="bubble" id="story-bubble" style="font-size:30px; direction:rtl">…</div>
  <div id="story-en"></div>
  <div class="stage" id="story-stage"></div>
  <div class="choices" id="story-choices"></div>
  <div id="story-controls">
    <button class="prompt-btn" onclick="replayLine()" style="margin:0">🔊</button>
    <button class="big-btn btn-green" id="story-next" style="min-width:160px" onclick="nextLine()">Next ▶</button>
  </div>
  <button class="orig-btn" id="story-original" onclick="startListen(storyKey)">🎧 Hear the real story</button>
</section>

<!-- ================= STORY TIME (the original recording, local only) ================= -->
<section id="listen" class="screen">
  <button class="back" onclick="go('story')">⬅︎</button>
  <div class="bubble" id="listen-title" style="font-size:24px">🎧</div>
  <div id="listen-credit"></div>
  <svg id="listen-scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="listen-sub"></div>
  <div id="listen-parts"></div>
  <button class="big-btn btn-green" id="listen-play" style="min-width:170px" onclick="taleToggle()">▶︎ Play</button>
  <div id="listen-bar"><div id="listen-fill"></div></div>
  <div id="listen-time">0:00 / 0:00</div>
</section>

<!-- ================= FEED KOOCHOOLOO ================= -->
<section id="feed" class="screen">
  <button class="back" onclick="go('home')">⬅︎</button>
  <div class="bubble" id="feed-bubble" style="direction:rtl">…</div>
  <div id="feed-en"></div>
  <div id="feed-hamster-wrap"><svg id="feed-hamster" class="mascot" viewBox="0 0 200 200" style="width:140px;height:140px"></svg></div>
  <div id="feed-meter"><div id="feed-fill"></div><div id="feed-meter-label">Tummy</div></div>
  <button class="prompt-btn" onclick="feedAsk()" style="margin:4px">🔊 Again</button>
  <div class="choices" id="feed-choices"></div>
</section>

<!-- One-time note shown only if a recording fails and we fall back to robot voice -->
<div id="voice-tip">
  🔈 Couldn't load a recording, using the device voice instead. If sound is missing, run the app from a
  local server (ask in chat) instead of opening the file directly.
  <b onclick="document.getElementById('voice-tip').style.display='none'">Got it</b>
</div>

<script>
/* ---------------------------------------------------------
   Farsi Friends — multi-theme prototype.
   Flow: Home (pick theme) -> Menu (Learn / Play) -> activity.
   Audio = pre-generated neural Persian MP3s in audio/.
----------------------------------------------------------*/

const THEMES = [
  {
    id: "greetings", name: "Greetings", icon: "👋",
    phrases: [
      // Hello & Goodbye
      { fa:"سلام",        tr:"salâm",         say:"salaam",        en:"Hello",         emoji:"👋", group:"👋 Hello & Goodbye", audio:"audio/salam.mp3" },
      { fa:"درود",        tr:"dorood",        say:"doh rood",      en:"Hi / Greetings", emoji:"🌸", group:"👋 Hello & Goodbye", audio:"audio/dorood.mp3" },
      { fa:"خداحافظ",     tr:"khodâhâfez",    say:"khoda hafez",   en:"Goodbye",       emoji:"🙋", group:"👋 Hello & Goodbye", audio:"audio/khodahafez.mp3" },
      { fa:"شب بخیر",     tr:"shab bekheyr",  say:"shab be kheyr", en:"Good night",    emoji:"🌙", group:"👋 Hello & Goodbye", audio:"audio/shab_bekheyr.mp3" },
      // How are you?
      { fa:"چطوری؟",      tr:"chetori?",      say:"che tori",      en:"How are you?",  emoji:"🤔", group:"🤔 How are you?", audio:"audio/chetori.mp3" },
      { fa:"خوبی؟",       tr:"khoobi?",       say:"khoo bee",      en:"Are you well?", emoji:"🙂", group:"🤔 How are you?", audio:"audio/khoobi.mp3" },
      { fa:"خوبم",        tr:"khoobam",       say:"khoo bam",      en:"I'm good",      emoji:"👍", group:"🤔 How are you?", audio:"audio/khoobam.mp3" },
      // Everyday words
      { fa:"مرسی",        tr:"mersi",         say:"merci",         en:"Thank you",     emoji:"🙏", group:"💬 Everyday words", audio:"audio/mersi.mp3" },
      { fa:"بله",         tr:"bale",          say:"baleh",         en:"Yes",           emoji:"✅", group:"💬 Everyday words", audio:"audio/bale.mp3" },
      { fa:"نه",          tr:"na",            say:"na",            en:"No",            emoji:"🚫", group:"💬 Everyday words", audio:"audio/na.mp3" },
      { fa:"دوستت دارم",  tr:"doostet dâram", say:"dooset daaram", en:"I love you",    emoji:"❤️", group:"💬 Everyday words", audio:"audio/dooset_daram.mp3" },
    ],
  },
  {
    id: "food", name: "Food", icon: "🍎",
    phrases: [
      // Fruit
      { fa:"سیب",         tr:"sib",           say:"seeb",          en:"Apple",         emoji:"🍎", group:"🍓 Fruit", audio:"audio/sib.mp3" },
      { fa:"موز",         tr:"moaz",          say:"mowz",          en:"Banana",        emoji:"🍌", group:"🍓 Fruit", audio:"audio/moz.mp3" },
      { fa:"انگور",       tr:"angoor",        say:"an goor",       en:"Grapes",        emoji:"🍇", group:"🍓 Fruit", audio:"audio/angoor.mp3" },
      { fa:"پرتقال",      tr:"porteghâl",     say:"por te ghaal",  en:"Orange",        emoji:"🍊", group:"🍓 Fruit", audio:"audio/porteghal.mp3" },
      { fa:"هندوانه",     tr:"hendevâne",     say:"hen de vaa ne", en:"Watermelon",    emoji:"🍉", group:"🍓 Fruit", audio:"audio/hendevane.mp3" },
      { fa:"گیلاس",       tr:"gilâs",         say:"gee laas",      en:"Cherry",        emoji:"🍒", group:"🍓 Fruit", audio:"audio/gilas.mp3" },
      { fa:"هلو",         tr:"holoo",         say:"ho loo",        en:"Peach",         emoji:"🍑", group:"🍓 Fruit", audio:"audio/holoo.mp3" },
      // Vegetables
      { fa:"هویج",        tr:"havij",         say:"ha veej",       en:"Carrot",        emoji:"🥕", group:"🥕 Vegetables", audio:"audio/havij.mp3" },
      { fa:"گوجه‌فرنگی",   tr:"goje farangi",  say:"go je fa ran gee", en:"Tomato",     emoji:"🍅", group:"🥕 Vegetables", audio:"audio/gojefarangi.mp3" },

/* ---------- Hamster wheel (home screen) ---------- */
function wheelSVG() {
  let rungs = '';
  const n = 16, inner = 64, outer = 86, c = 100;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI;
    rungs += `<line x1="${(c+inner*Math.cos(a)).toFixed(1)}" y1="${(c+inner*Math.sin(a)).toFixed(1)}" x2="${(c+outer*Math.cos(a)).toFixed(1)}" y2="${(c+outer*Math.sin(a)).toFixed(1)}" stroke="#caa168" stroke-width="5" stroke-linecap="round"/>`;
  }
  return `<circle cx="100" cy="100" r="90" fill="none" stroke="#b9854f" stroke-width="9"/>
          <circle cx="100" cy="100" r="60" fill="none" stroke="#caa168" stroke-width="6"/>${rungs}`;
}

function cheerMascot(id) {
  const m = document.getElementById(id);

  m.classList.add('happy');

}

/* ---------- Navigation ----------
   Every activity is driven by timers (replay the prompt, next round, …).
   Leaving a screen has to cancel them and hush the audio, or the game keeps
   playing — and talking — over whatever screen the kid moved to.          */
let screenId = 'home';
let pendingTimers = [];

// setTimeout that quietly gives up if the kid has left the screen since.
function later(fn, ms) {
  const from = screenId;
  const t = setTimeout(() => { if (screenId === from) fn(); }, ms);
  pendingTimers.push(t);
  return t;
}
function stopAudio() {
  try { if (player) { player.pause(); player.currentTime = 0; } } catch (e) { /* ignore */ }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  // The long recording only pauses — leaving the screen keeps our place in it.
  try { if (taleAudio) { taleAudio.pause(); setTaleButton(); } } catch (e) { /* ignore */ }
}

function go(id) {
  pendingTimers.forEach(clearTimeout);
  pendingTimers = [];
  stopAudio();
  screenId = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'home') { say({audio:'audio/salam.mp3', fa:'سلام', say:'salaam'}); cheerMascot('mascot-home'); }
}

/* ---------- Build Learn grid for the current theme ---------- */
function buildLearnGrid() {
  const container = document.getElementById('learn-content');
  container.innerHTML = '';
  document.getElementById('learn').scrollTop = 0;   // new theme starts at the top
  document.getElementById('learn-bubble').textContent = "Tap a card to hear it!";
  let lastGroup = null, grid = null;
  currentTheme.phrases.forEach(p => {
    // Start a new labeled section whenever the group changes
    if (p.group && p.group !== lastGroup) {
      lastGroup = p.group;
      const head = document.createElement('div');
      head.className = 'section-head';
      head.textContent = p.group;
      container.appendChild(head);
      grid = document.createElement('div');
      grid.className = 'grid';
      container.appendChild(grid);
    } else if (!grid) {            // theme without groups: one plain grid
      grid = document.createElement('div');
      grid.className = 'grid';
      container.appendChild(grid);
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="emoji">${p.emoji}</div>
                      <div class="fa">${p.fa}</div>
                      <div class="tr">${p.tr}</div>
                      <div class="en">${p.en}</div>`;
    card.onclick = () => {
      say(p);
      document.getElementById('learn-bubble').textContent = p.en + " = " + p.tr;
    };
    grid.appendChild(card);
  });
}

/* ---------- Play: "tap what you heard" ---------- */
let current = null;
function startPlay() {
  go('play');
  nextRound();
}
function nextRound() {
  const pool = [...currentTheme.phrases].sort(() => Math.random() - 0.5);
  // pool[0] and pool[1] are both inside the 3 shown, so either works as the
  // target — take the second when the first would repeat the last round.
  const target = (pool[0] === current && pool.length > 1) ? pool[1] : pool[0];
  const options = pool.slice(0, 3).sort(() => Math.random() - 0.5);
  current = target;

  const box = document.getElementById('choices');
  box.innerHTML = '';
  box.style.pointerEvents = '';
  options.forEach(p => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = p.emoji;
    b.onclick = () => choose(b, p);
    box.appendChild(b);
  });
  later(sayCurrent, 400);
}
function sayCurrent() { if (current) say(current); }

function choose(btn, picked) {
  if (picked === current) {
    // Lock the tray during the celebration, or a stray tap on a leftover
    // wrong answer shakes and re-asks over the top of "âfarin!".
    document.getElementById('choices').style.pointerEvents = 'none';
    btn.classList.add('right');
    say({audio:'audio/afarin.mp3', fa:'آفرین', say:'aafarin'});  // âfarin = well done!
    cheerMascot('mascot-play');
    confetti();
    later(nextRound, 1500);
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 400);
    later(sayCurrent, 500);  // gently replay, let them try again
  }
}

/* ---------- Confetti ---------- */
function confetti() {
  const bits = ['🎉','⭐️','🌟','💫','🎊','❤️'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = bits[Math.floor(Math.random()*bits.length)];
    c.style.left = Math.random()*100 + 'vw';
    c.style.animationDelay = Math.random()*0.4 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

/* Every character the stage knows how to draw. A story lists the ones it uses in
   its `cast`, and the stage is built from that — two players or three. */
const ACTOR_SVG  = { hamster: mascotSVG, cat: catSVG, rooster: roosterSVG, fox: foxSVG };
/* Possessive, so it reads "Tap Koochooloo's reply:" / "Tap the rooster's reply:" */
const ACTOR_NAME = { hamster: "Koochooloo's", cat: "the cat's", rooster: "the rooster's", fox: "the fox's" };

let storyLines = [], storyIdx = 0, storyKey = null, storyCast = [];
function startStory(key) {
  const c = CONVOS[key]; if (!c) return;
  storyLines = c.lines; storyIdx = 0; storyKey = key;
  storyCast = c.cast || ['hamster', 'cat'];
  buildStage(document.getElementById('story-stage'), storyCast, 'char-');
  const nb = document.getElementById('story-next');
  nb.textContent = 'Next ▶'; nb.onclick = nextLine;
  // Offer the original recording only when this story has one and the files are here
  document.getElementById('story-original')
          .classList.toggle('on', !!(c.original && taleAvailable[key]));
  go('story');
  showLine();
}
/* Draw a cast onto a stage element. idPrefix keeps the story and listen stages
   from fighting over the same element ids. */
function buildStage(stage, cast, idPrefix) {
  stage.innerHTML = '';
  stage.classList.toggle('trio', cast.length > 2);   // three actors need to be smaller
  cast.forEach(who => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.id = idPrefix + who;
    svg.setAttribute('class', 'actor');
    svg.setAttribute('viewBox', '0 0 200 200');
    svg.innerHTML = (ACTOR_SVG[who] || mascotSVG)();
    stage.appendChild(svg);
  });
}
function setActiveSpeaker(who) {
  storyCast.forEach(c => {
    document.getElementById('char-' + c).classList.toggle('speaking', c === who);
  });
}
function showLine() {
  const line = storyLines[storyIdx];
  const choicesBox = document.getElementById('story-choices');
  const nextBtn = document.getElementById('story-next');
  choicesBox.innerHTML = '';
  storyCast.forEach(c => document.getElementById('char-' + c).classList.remove('happy'));
  setActiveSpeaker(line.who);

  if (line.choice) {                     // interactive: kid picks the speaker's reply
    nextBtn.style.display = 'none';
    document.getElementById('story-bubble').textContent = '؟';
    document.getElementById('story-en').textContent = `Tap ${ACTOR_NAME[line.who] || 'the'} reply:`;
    line.choice.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'choice-line';
      b.innerHTML = `<div class="cl-fa">${opt.fa}</div><div class="cl-en">${opt.en}</div>`;
      b.onclick = () => {
        document.getElementById('story-bubble').textContent = opt.fa;
        document.getElementById('story-en').textContent = opt.en;
        say({ audio: opt.audio });
        choicesBox.innerHTML = '';
        later(nextLine, 1700);   // nextLine ends the story if that was the last
      };
      choicesBox.appendChild(b);
    });
    return;
  }

  nextBtn.style.display = '';
  document.getElementById('story-bubble').textContent = line.fa;
  document.getElementById('story-en').textContent = line.en;
  say({ audio: line.audio });
}
function replayLine() {
  const line = storyLines[storyIdx];
  if (!line) return;
  if (line.audio) { say({ audio: line.audio }); return; }
  // On a choice there is nothing of Koochooloo's to replay yet — repeat the
  // cat's question instead, which is what the kid actually needs to hear again.
  for (let i = storyIdx - 1; i >= 0; i--) {
    if (storyLines[i].audio) { say({ audio: storyLines[i].audio }); return; }
  }
}
function nextLine() {
  storyIdx++;
  if (storyIdx >= storyLines.length) { endStory(); return; }
  showLine();
}
function endStory() {
  const hero = storyCast[0];             // whoever leads this story takes the bow
  setActiveSpeaker(hero);
  document.getElementById('char-' + hero).classList.add('happy');
  document.getElementById('story-choices').innerHTML = '';
  document.getElementById('story-bubble').textContent = 'آفرین! 🎉';
  document.getElementById('story-en').textContent = 'You finished the story!';
  say({ audio: 'audio/cc_afarin.mp3' });
  confetti();
  const nb = document.getElementById('story-next');
  nb.textContent = '↺ Again';
  nb.onclick = () => startStory(storyKey);   // whichever story just finished
}

/* ---------- Story time: the original recording ---------- */
/* Long-form playback gets its own element. `player` is for the short clips and is
   rewound to 0 on every screen change, which would lose our place in a 28-minute
   recording; this one is only ever paused, so stepping away and coming back resumes. */
let taleAudio = null, talePart = 0, taleStory = null, taleKey = null;
let taleData = null, taleSubIdx = -1, taleSceneName = null;
const taleAvailable = {};   // story key -> is the local recording actually here?

/* These files are deliberately absent from the published site, so ask before
   offering them. A failed probe just leaves the button hidden. */
Object.keys(CONVOS).forEach(key => {
  const orig = CONVOS[key].original;
  if (!orig || !orig.parts.length) return;
  fetch(orig.parts[0].src, { method: 'HEAD' })
    .then(r => { taleAvailable[key] = r.ok; })
    .catch(() => { taleAvailable[key] = false; });
});

function startListen(key) {
  const c = CONVOS[key];
  if (!c || !c.original || !taleAvailable[key]) return;
  taleStory = c; taleKey = key; talePart = 0;
  document.getElementById('listen-title').textContent = '🎧 ' + c.title;
  document.getElementById('listen-credit').textContent = c.original.by;
  // Subtitles and scene cues live beside the audio, so they're absent on the
  // published site too. Without them you still get the recording, just bare.
  if (!taleData && c.original.story) {
    fetch(c.original.story).then(r => r.ok ? r.json() : null)
      .then(d => { taleData = d || {}; taleProgress(); })
      .catch(() => { taleData = {}; });
  }
  const box = document.getElementById('listen-parts');
  box.innerHTML = '';
  c.original.parts.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'part-btn' + (i === 0 ? ' sel' : '');
    b.textContent = p.label;
    b.onclick = () => talePick(i);
    box.appendChild(b);
  });
  go('listen');
  taleLoad(0, false);
}
function taleLoad(i, autoplay) {
  if (!taleStory) return;
  const part = taleStory.original.parts[i];
  if (!part) return;
  talePart = i;
  taleSubIdx = -1; taleSceneName = null;   // force a resync onto the new part's cues
  [...document.getElementById('listen-parts').children]
    .forEach((b, n) => b.classList.toggle('sel', n === i));
  if (!taleAudio) {
    taleAudio = new Audio();
    taleAudio.addEventListener('timeupdate', taleProgress);
    taleAudio.addEventListener('ended', taleNextPart);
    taleAudio.addEventListener('error', () => {});
  }
  taleAudio.pause();
  taleAudio.src = part.src;
  taleAudio.currentTime = 0;
  taleProgress();
  if (autoplay) taleAudio.play().catch(() => {});
  setTaleButton();
}
function talePick(i) { taleLoad(i, !taleAudio || !taleAudio.paused); }
function taleNextPart() {
  if (taleStory && talePart + 1 < taleStory.original.parts.length) taleLoad(talePart + 1, true);
  else setTaleButton();
}
function taleToggle() {
  if (!taleAudio) return;
  if (taleAudio.paused) taleAudio.play().catch(() => {});
  else taleAudio.pause();
  setTaleButton();
}
function setTaleButton() {
  const b = document.getElementById('listen-play');
  b.textContent = (taleAudio && !taleAudio.paused) ? '❚❚ Pause' : '▶︎ Play';
}
/* Which part's cue table are we in? Keyed by the mp3's basename. */
function taleCues() {
  if (!taleData || !taleStory) return null;
  const src = (taleStory.original.parts[talePart] || {}).src || '';
  const name = src.split('/').pop().replace('.mp3', '');
  return taleData[name] || null;
}
/* Last entry whose start time has passed — the list is short and sorted, so a
   plain scan is cheaper than being clever, and it survives scrubbing backwards. */
function taleAt(list, t) {
  let lo = 0, hi = list.length - 1, best = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (list[mid][0] <= t) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return best;
}
function taleSync() {
  const cues = taleCues();
  const subBox = document.getElementById('listen-sub');
  const sceneBox = document.getElementById('listen-scene');
  if (!cues) { subBox.textContent = ''; return; }
  const t = taleAudio ? taleAudio.currentTime : 0;

  const i = taleAt(cues.subs, t);
  if (i !== taleSubIdx) {
    taleSubIdx = i;
    const cue = i < 0 ? null : cues.subs[i];
    // A third element flags a sung line. Songs are held a whole verse-line at a
    // time — the recording's timings are least exact under the music — so mark
    // them as lyrics rather than pretending to track them word by word.
    subBox.textContent = cue ? (cue[2] ? '♪ ' + cue[1] + ' ♪' : cue[1]) : '';
    subBox.classList.toggle('sung', !!(cue && cue[2]));
  }
  const s = taleAt(cues.scenes, t);
  const name = s < 0 ? cues.scenes[0][1] : cues.scenes[s][1];
  if (name !== taleSceneName) {
    taleSceneName = name;
    sceneBox.innerHTML = (SCENES[name] || SCENES.cabin)();
    // Restart the fade: drop the class, force a reflow, add it back.
    sceneBox.classList.remove('fade');
    void sceneBox.getBoundingClientRect().width;
    sceneBox.classList.add('fade');
  }
}
function taleFmt(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}
function taleProgress() {
  if (!taleAudio) return;
  const d = taleAudio.duration || 0;
  document.getElementById('listen-fill').style.width =
    (d ? (taleAudio.currentTime / d * 100) : 0) + '%';
  document.getElementById('listen-time').textContent =
    taleFmt(taleAudio.currentTime) + ' / ' + taleFmt(d);
  taleSync();
}
/* Tap anywhere on the bar to scrub — a 28-minute story needs it */
document.getElementById('listen-bar').addEventListener('click', e => {
  if (!taleAudio || !taleAudio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  taleAudio.currentTime = ((e.clientX - r.left) / r.width) * taleAudio.duration;
  taleProgress();
});

];
const FEED_GOAL = 5;
let feedScore = 0, feedTarget = null, feedPool = FEED_FOODS, feedMode = 'all';

function startFeed(mode) {
  feedMode = mode || 'all';
  feedPool = feedMode === 'nuts' ? FEED_FOODS.filter(f => f.nut) : FEED_FOODS;
  feedScore = 0;
  setFeedMeter();
  document.getElementById('feed-hamster').innerHTML = mascotSVG();
  go('feed');
  feedRound();
}
function setFeedMeter() {
  const pct = Math.min(100, Math.round(feedScore / FEED_GOAL * 100));
  document.getElementById('feed-fill').style.width = pct + '%';
  document.getElementById('feed-meter-label').textContent =
    feedScore >= FEED_GOAL ? 'Full! 😋' : `Tummy: ${feedScore}/${FEED_GOAL}`;
  // her belly rounds out (wider more than taller) as she fills up
  const f = feedScore / FEED_GOAL;
  const ham = document.getElementById('feed-hamster');
  ham.style.transformOrigin = '50% 92%';
  ham.style.transform = `scale(${(1 + f*0.58).toFixed(3)}, ${(1 + f*0.22).toFixed(3)})`;
}
// fly the chosen food in an arc into Koochooloo's mouth, then call done()
function flyFoodToMouth(btn, food, done) {
  const ham = document.getElementById('feed-hamster');
  if (!ham) { done && done(); return; }
  const br = btn.getBoundingClientRect();
  const hr = ham.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'flying-food';
  if (food.icon) fly.innerHTML = `<svg viewBox="0 0 100 100" width="70" height="70">${food.icon}</svg>`;
  else fly.textContent = food.emoji;
  fly.style.left = (br.left + br.width/2) + 'px';
  fly.style.top  = (br.top  + br.height/2) + 'px';
  fly.style.setProperty('--dx', ((hr.left + hr.width/2) - (br.left + br.width/2)) + 'px');
  fly.style.setProperty('--dy', ((hr.top  + hr.height*0.62) - (br.top + br.height/2)) + 'px');
  document.body.appendChild(fly);
  fly.addEventListener('animationend', () => { fly.remove(); done && done(); }, { once:true });
  setTimeout(() => { if (fly.parentNode) { fly.remove(); done && done(); } }, 900); // safety
}
function feedRound() {
  const pool = [...feedPool].sort(() => Math.random() - 0.5);
  // don't ask for the same food twice in a row (both are among the 3 shown)
  feedTarget = (pool[0] === feedTarget && pool.length > 1) ? pool[1] : pool[0];
  const options = pool.slice(0, 3).sort(() => Math.random() - 0.5);
  document.getElementById('feed-bubble').textContent = 'دلم ' + feedTarget.fa + ' می‌خواد!';
  document.getElementById('feed-en').textContent = 'I want ' + feedTarget.en + '!';
  const box = document.getElementById('feed-choices');
  box.innerHTML = '';
  options.forEach(food => {
    const b = document.createElement('button');
    b.className = 'choice';
    if (food.icon) b.innerHTML = `<svg viewBox="0 0 100 100" width="96" height="96">${food.icon}</svg>`;
    else b.textContent = food.emoji;
    b.onclick = () => feedPick(b, food);
    box.appendChild(b);
  });
  later(feedAsk, 400);
}
function feedAsk() { if (feedTarget) say({ audio: feedTarget.want }); }

function feedPick(btn, food) {
  if (food === feedTarget) {
    const box = document.getElementById('feed-choices');
    box.style.pointerEvents = 'none';           // no double-taps mid-animation
    btn.style.visibility = 'hidden';            // the food "leaves" the tray
    flyFoodToMouth(btn, food, () => {           // arc into her mouth, then:
      if (screenId !== 'feed') return;          // she left mid-flight
      const wrap = document.getElementById('feed-hamster-wrap');
      wrap.classList.remove('chomp'); void wrap.offsetWidth; wrap.classList.add('chomp');
      say({ audio: 'audio/cc09.mp3' });         // "khoshmaze ast!" (yum!)
      feedScore++;
      setFeedMeter();                           // fills meter + grows belly
      box.style.pointerEvents = '';
      if (feedScore >= FEED_GOAL) later(feedWin, 850);
      else later(feedRound, 850);
    });
  } else {
    btn.classList.add('wrong');
    setTimeout(() => btn.classList.remove('wrong'), 400);
    later(feedAsk, 500);                        // gently repeat the request
  }
}
function feedWin() {
  document.getElementById('feed-bubble').textContent = 'سیر شدم، مرسی!';
  document.getElementById('feed-en').textContent = "I'm full, thank you!";
  cheerMascot('feed-hamster');
  confetti();
  say({ audio: 'audio/kf_full.mp3' });
  const box = document.getElementById('feed-choices');
  box.innerHTML = '';
  const again = document.createElement('button');
  again.className = 'big-btn btn-green';
  again.textContent = '↺ Again';
  again.onclick = () => startFeed(feedMode);
  box.appendChild(again);
}

/* ---------- Audio (set up LAST, fully guarded) ----------
   Plays pre-generated Persian recordings from audio/. If a file
   fails it falls back to the browser voice. All wrapped in
   try/catch so audio can never blank the screens.              */
let player = null, faVoice = null, hasPersian = false, tipShown = false;

function refreshVoices() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    faVoice = voices.find(v => /^fa(-|_)/i.test(v.lang)) || null;
    hasPersian = !!faVoice;
  } catch (e) { /* ignore */ }
}
function say(phrase) {
  try {
    if (phrase && phrase.audio) {
      if (player) { player.pause(); }
      player = new Audio(phrase.audio);
      player.play().catch(() => speakFallback(phrase));
    } else {
      speakFallback(phrase);
    }
  } catch (e) { /* never let audio break the app */ }
}
function speakFallback(phrase) {
  try {
    if (!('speechSynthesis' in window) || !phrase) return;
    if (!faVoice) refreshVoices();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance();
    if (hasPersian) { u.text = phrase.fa; u.lang = 'fa-IR'; u.voice = faVoice; }
    else {
      u.text = phrase.say || phrase.fa; u.lang = 'en-US';
      if (!tipShown) { tipShown = true; const t = document.getElementById('voice-tip'); if (t) t.style.display = 'block'; }
    }
    u.rate = 0.8;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}
try {
  if ('speechSynthesis' in window) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }
} catch (e) { /* ignore */ }
</script>
</body>
</html>
